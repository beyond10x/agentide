info:
  title: agentide-engine
  version: v1
  description: |-
    `agentide-engine` in the `agentide` specification.

    Validates intents, plans effects, obtains authority, journals, dispatches, and projects sessions.

    A coding-session interface in which agents invoke stable semantic intents while deployments bind those intents to guarded implementations and humans observe the same durable event projection.

    The specification declares no transport, so each address below is a name and not a topic on a named broker. Servers, protocol bindings, security schemes, message keys, partitioning, retention and ordering are absent because the model does not state them.
