info:
  title: agentide-engine
  summary: Validates intents, plans effects, obtains authority, journals, dispatches, and projects sessions.
  description: |-
    The HTTP surface of `agentide-engine`, one of the components of `agentide` v1.

    Every path here is one semantic command, so the method is always POST and the path is the command's wire name under its domain's: a command is not a resource, and this document does not invent one. A status code is the outcome the specification declares — 202 for a branch that was taken, 422 for a refusal the input decides, 502 for a refusal decided outside the request — and the `outcome` property of every response body names the branch. Events emitted by a branch are published to consumers through the event transport; they are not returned here.

    This component declares `reached_by: network`, so its callers are not deployed with it and this contract is the surface they reach it through. That declaration is also why the views its domains declare have paths here: a GET under `views` per projection, answering every row it holds. There is no page size, no cursor, no ordering and no filter parameter, because the specification states none — a view's filter is part of the projection, not of the request.
  version: v1
  x-ess-provenance:
    system: agentide
    specification_version: v1
    source_digest: 509495079a366d767a747dbfcd22e419c28040b7ff32d15a1f284393168d16ab
