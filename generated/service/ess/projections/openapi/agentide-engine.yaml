  x-ess-reached-by: network
tags:
- name: coding
  description: Semantic observation, change, execution, collaboration, evidence, and delivery intents.
- name: coordination
  description: Durable hosted collaboration references stored by Service SDK without project file bytes.
- name: sessions
  description: The durable identity and observable projection of one coding session.
- name: surface
  description: A renderer-neutral virtual workbench shared by agents, the browser, CLI snapshots, and the console TUI.
