name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: agentide-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Token for private sibling dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            connectors
            eventlog
            service-sdk

      - name: Authenticate private sibling dependencies
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/beyond10x/".insteadOf "https://github.com/beyond10x/"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned specification tools
        run: |
          cargo install --git https://github.com/beyond10x/aep \
            --rev 1c4e614829cfa9a35e9b809c44855bd3c8aefd9d \
            --locked --bin aep protocol-cli
          cargo install --git https://github.com/beyond10x/ess \
            --tag 0.9.2 \
            --locked --bin ess ess-cli

      - name: Run the one repository gate
        run: cargo xtask gate
