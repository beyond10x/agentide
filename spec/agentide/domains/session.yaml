domain: agentide.session
summary: The durable identity and observable projection of one coding session.
naming: {wire: sessions, display: Sessions}

types:
  - name: agentide.session.SessionId
    kind: newtype
    of: String
  - name: agentide.session.RequestId
    kind: newtype
    of: String
  - name: agentide.session.WorkspaceRoot
    kind: newtype
    of: String
  - name: agentide.session.Cursor
    kind: newtype
    of: Integer
  - name: agentide.session.EventLimit
    kind: newtype
    of: Integer
  - {name: agentide.session.ProjectId, kind: newtype, of: String}
  - {name: agentide.session.SourceRevision, kind: newtype, of: String}
  - {name: agentide.session.WorkspaceSessionId, kind: newtype, of: String}
  - {name: agentide.session.ManifestDigest, kind: newtype, of: String}
  - name: agentide.session.SessionScopes
    kind: struct
    fields:
      - {name: principal, type: Optional<String>}
      - {name: team, type: Optional<String>}
      - {name: project, type: Optional<String>}

entities:
  - name: agentide.session.CodingSession
    identity: {name: session_id, type: agentide.session.SessionId}
    fields:
      - {name: workspace_root, type: agentide.session.WorkspaceRoot}
      - {name: objective, type: String}
      - {name: project_id, type: Optional<agentide.session.ProjectId>}
      - {name: source_revision, type: Optional<agentide.session.SourceRevision>}
      - {name: workspace_session_id, type: Optional<agentide.session.WorkspaceSessionId>}
      - {name: manifest_digest, type: Optional<agentide.session.ManifestDigest>}
      - {name: owner, type: String}
      - {name: scopes, type: agentide.session.SessionScopes}
    lifecycle:
      initial: Active
      states: [Active, Closed]
      terminal: [Closed]
      transitions:
        - {name: close, from: [Active], to: Closed}

actors:
  - name: agentide.session.Operator
    may: [agentide.session.StartSession, agentide.session.EnsureHostedSession, agentide.session.CloseSession]
    naming: {display: Operator}
  - name: agentide.session.CodingAgent
    may: [agentide.session.SnapshotSession, agentide.session.ReadEvents]
    naming: {display: Coding agent}

errors:
  - name: agentide.session.SessionRefusal
    summary: The session operation was not admitted or could not be observed exactly.
    fields:
      - {name: code, type: String}
      - {name: message, type: String}
      - {name: retryable, type: Boolean}
  - name: agentide.session.SessionStateConflict
    summary: The session is not in a state this command acts from.
    fields:
      - {name: state, type: agentide.session.CodingSession.State}

commands:
  - name: agentide.session.StartSession
    naming: {wire: session-start, display: Start session}
    input:
      - {name: workspace_root, type: agentide.session.WorkspaceRoot}
      - {name: objective, type: String}
      - {name: project_id, type: Optional<agentide.session.ProjectId>}
      - {name: source_revision, type: Optional<agentide.session.SourceRevision>}
      - {name: workspace_session_id, type: Optional<agentide.session.WorkspaceSessionId>}
      - {name: manifest_digest, type: Optional<agentide.session.ManifestDigest>}
      - {name: scopes, type: agentide.session.SessionScopes}
    outcomes:
      - name: started
        creates: agentide.session.CodingSession
        instance: session_id
        emits: [agentide.session.SessionStarted]
        payload:
          agentide.session.SessionStarted:
            workspace_root: input.workspace_root
            objective: input.objective
            project_id: input.project_id
            source_revision: input.source_revision
            workspace_session_id: input.workspace_session_id
            manifest_digest: input.manifest_digest
            scopes: input.scopes
      - name: refused
        external: the workspace or standalone binding is unavailable
        error: agentide.session.SessionRefusal

  - name: agentide.session.EnsureHostedSession
    naming: {wire: hosted-session-ensure, display: Ensure hosted session}
    input:
      - {name: session_id, type: agentide.session.SessionId}
      - {name: workspace_root, type: agentide.session.WorkspaceRoot}
      - {name: objective, type: String}
      - {name: project_id, type: agentide.session.ProjectId}
      - {name: source_revision, type: agentide.session.SourceRevision}
      - {name: workspace_session_id, type: agentide.session.WorkspaceSessionId}
      - {name: manifest_digest, type: agentide.session.ManifestDigest}
      - {name: scopes, type: agentide.session.SessionScopes}
    outcomes:
      - name: started
        creates: agentide.session.CodingSession
        instance: session_id
        emits: [agentide.session.SessionStarted]
        payload:
          agentide.session.SessionStarted:
            session_id: input.session_id
            workspace_root: input.workspace_root
            objective: input.objective
            project_id: input.project_id
            source_revision: input.source_revision
            workspace_session_id: input.workspace_session_id
            manifest_digest: input.manifest_digest
            scopes: input.scopes
      - name: refused
        external: the hosted workspace or durable coordination binding is unavailable
        error: agentide.session.SessionRefusal

  - name: agentide.session.CloseSession
    naming: {wire: session-close, display: Close session}
    input:
      - {name: session_id, type: agentide.session.SessionId}
      - {name: request_id, type: agentide.session.RequestId}
    outcomes:
      - name: closed
        moves: agentide.session.CodingSession.close
        instance: session_id
        emits: [agentide.session.SessionClosed]
        payload:
          agentide.session.SessionClosed:
            session_id: input.session_id
      - name: wrong-state
        wrong_state: true
        error: agentide.session.SessionStateConflict
      - name: refused
        external: durable state cannot be updated
        error: agentide.session.SessionRefusal

  - name: agentide.session.SnapshotSession
    naming: {wire: session-snapshot, display: Snapshot session}
    input:
      - {name: session_id, type: agentide.session.SessionId}
      - {name: request_id, type: agentide.session.RequestId}
    outcomes:
      - name: observed
        emits: [agentide.session.SessionObserved]
        payload:
          agentide.session.SessionObserved:
            session_id: input.session_id
            request_id: input.request_id
      - name: refused
        external: the durable session cannot be read exactly
        error: agentide.session.SessionRefusal

  - name: agentide.session.ReadEvents
    naming: {wire: event-read, display: Read session events}
    input:
      - {name: session_id, type: agentide.session.SessionId}
      - {name: request_id, type: agentide.session.RequestId}
      - {name: after, type: Optional<agentide.session.Cursor>}
      - {name: limit, type: agentide.session.EventLimit}
    outcomes:
      - name: observed
        emits: [agentide.session.SessionObserved]
        payload:
          agentide.session.SessionObserved:
            session_id: input.session_id
            request_id: input.request_id
      - name: refused
        external: the requested event window cannot be represented
        error: agentide.session.SessionRefusal

events:
  - name: agentide.session.SessionStarted
    fields:
      - {name: session_id, type: agentide.session.SessionId}
      - {name: workspace_root, type: agentide.session.WorkspaceRoot}
      - {name: objective, type: String}
      - {name: project_id, type: Optional<agentide.session.ProjectId>}
      - {name: source_revision, type: Optional<agentide.session.SourceRevision>}
      - {name: workspace_session_id, type: Optional<agentide.session.WorkspaceSessionId>}
      - {name: manifest_digest, type: Optional<agentide.session.ManifestDigest>}
      - {name: owner, type: String}
      - {name: scopes, type: agentide.session.SessionScopes}
  - name: agentide.session.SessionClosed
    fields:
      - {name: session_id, type: agentide.session.SessionId}
  - name: agentide.session.SessionObserved
    fields:
      - {name: session_id, type: agentide.session.SessionId}
      - {name: request_id, type: agentide.session.RequestId}

views:
  - name: agentide.session.SessionSnapshot
    source: agentide.session.CodingSession
    consistency: read_your_writes
    fields:
      - {name: session_id, type: agentide.session.SessionId}
      - {name: workspace_root, type: agentide.session.WorkspaceRoot}
      - {name: objective, type: String}
      - {name: project_id, type: Optional<agentide.session.ProjectId>}
      - {name: source_revision, type: Optional<agentide.session.SourceRevision>}
      - {name: workspace_session_id, type: Optional<agentide.session.WorkspaceSessionId>}
      - {name: manifest_digest, type: Optional<agentide.session.ManifestDigest>}
      - {name: owner, type: String}
      - {name: scopes, type: agentide.session.SessionScopes}
      - {name: state, type: agentide.session.CodingSession.State}
    naming: {wire: snapshot, display: Session snapshot}
