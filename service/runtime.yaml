# Hosted AgentIDE coordination is a generated Service SDK aggregate. Source bytes remain in
# Workspace/Substrate and forge authority remains in Connectors; neither is duplicated here.
format: service-definition/3
service: agentide
realm: optional
delivery:
  kind: composed_connector

obligations:
  - name: bind_session_stream
    provider: sdk.aggregate.event-sourced/v1
    bindings:
      aggregate: agentide.session.CodingSession
      identity: session_id
      category: agentide-session
    description: Execute every coordination mutation against one AgentIDE session Eventlog stream.

  - name: authorize_session_owner
    provider: sdk.auth.owner-and-conjunctive-scopes/v1
    bindings:
      owner: agentide.session.CodingSession.owner
      scopes: agentide.session.CodingSession.scopes
    description: Admit only the verified owner or a currently authorized delegated executor.

  - name: authorize_requested_session_scopes
    provider: sdk.auth.requested-scopes/v1
    bindings: {scopes: scopes}
    description: Refuse a session whose requested delegation scopes exceed verified authority.

  - name: require_active_session
    provider: sdk.lifecycle.require-state/v1
    bindings: {entity: agentide.session.CodingSession, allowed: Active}
    description: Refuse state-changing operations after session close.

  - name: partition_session_projection
    provider: sdk.projection.auth-partitioned-visibility/v1
    bindings: {owner: owner, scopes: scopes}
    description: Partition session projections by authenticated tenant, exact realm, owner and scopes.

  - name: validate_grantee_partition
    provider: sdk.auth.same-partition-owner-transfer/v1
    bindings:
      owner: agentide.session.CodingSession.owner
      new_owner: grantee
    description: Admit grants only for a subject resolved inside the same authenticated partition.

  - name: nested_grant
    provider: sdk.aggregate.nested-entity/v1
    bindings:
      parent: agentide.session.CodingSession
      child: agentide.coordination.AuthorityGrant
      parent_identity: session_id
      child_identity: grant_id
    description: Resolve a grant only inside its parent coding-session stream.

  - name: nested_context_pin
    provider: sdk.aggregate.nested-entity/v1
    bindings:
      parent: agentide.session.CodingSession
      child: agentide.coordination.ContextPin
      parent_identity: session_id
      child_identity: pin_id
    description: Resolve a context pin only inside its parent coding-session stream.

  - name: nested_approval_checkpoint
    provider: sdk.aggregate.nested-entity/v1
    bindings:
      parent: agentide.session.CodingSession
      child: agentide.coordination.ApprovalCheckpoint
      parent_identity: session_id
      child_identity: checkpoint_id
    description: Resolve an approval checkpoint only inside its parent coding-session stream.

  - name: inherit_grant_authority
    provider: sdk.derive.inherit-parent-authority/v1
    bindings:
      parent: agentide.session.CodingSession
      child: agentide.coordination.AuthorityGrant
      parent_owner: agentide.session.CodingSession.owner
      parent_scopes: agentide.session.CodingSession.scopes
      child_owner: agentide.coordination.AuthorityGrant.owner
      child_scopes: agentide.coordination.AuthorityGrant.scopes
    description: Derive grant visibility from the session; callers cannot supply owner or scope.

  - name: inherit_context_pin_authority
    provider: sdk.derive.inherit-parent-authority/v1
    bindings:
      parent: agentide.session.CodingSession
      child: agentide.coordination.ContextPin
      parent_owner: agentide.session.CodingSession.owner
      parent_scopes: agentide.session.CodingSession.scopes
      child_owner: agentide.coordination.ContextPin.owner
      child_scopes: agentide.coordination.ContextPin.scopes
    description: Derive context-pin visibility from the session; callers cannot supply owner or scope.

  - name: inherit_checkpoint_authority
    provider: sdk.derive.inherit-parent-authority/v1
    bindings:
      parent: agentide.session.CodingSession
      child: agentide.coordination.ApprovalCheckpoint
      parent_owner: agentide.session.CodingSession.owner
      parent_scopes: agentide.session.CodingSession.scopes
      child_owner: agentide.coordination.ApprovalCheckpoint.owner
      child_scopes: agentide.coordination.ApprovalCheckpoint.scopes
    description: Derive checkpoint visibility from the session; callers cannot supply owner or scope.

  - name: hide_closed_session_children
    provider: sdk.projection.hide-terminal-parent/v1
    bindings:
      parent: agentide.session.CodingSession
      parent_identity: session_id
      terminal_states: Closed
    description: Hide child coordination projections once their session is closed.

  - name: filter_visible_sessions
    provider: sdk.auth.owner-and-conjunctive-scopes/v1
    bindings: {owner: owner, scopes: scopes}
    description: Filter every session query with current verified authority.

projections:
  - name: session_snapshot_projection
    view: agentide.session.SessionSnapshot
    delivery: inline_transactional
    obligations: [partition_session_projection]

  - name: grant_snapshot_projection
    view: agentide.coordination.GrantSnapshot
    delivery: inline_transactional
    obligations: [partition_session_projection, inherit_grant_authority, hide_closed_session_children]

  - name: context_pin_snapshot_projection
    view: agentide.coordination.ContextPinSnapshot
    delivery: inline_transactional
    obligations: [partition_session_projection, inherit_context_pin_authority, hide_closed_session_children]

  - name: approval_checkpoint_snapshot_projection
    view: agentide.coordination.ApprovalCheckpointSnapshot
    delivery: inline_transactional
    obligations: [partition_session_projection, inherit_checkpoint_authority, hide_closed_session_children]

intents:
  - name: start_session
    scope: agentide.manage
    command: agentide.session.StartSession
    stream_id: {kind: generated_uuid_v7}
    expected_version: {kind: no_stream}
    idempotency: {kind: operation_field, field: idempotency_key}
    event_bindings:
      - event: agentide.session.SessionStarted
        field: session_id
        source: {kind: stream_id}
      - event: agentide.session.SessionStarted
        field: owner
        source: {kind: context, value: current_authority}
    projections: [session_snapshot_projection]
    obligations: [bind_session_stream, authorize_requested_session_scopes]

  - name: ensure_hosted_session
    scope: agentide.manage
    command: agentide.session.EnsureHostedSession
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: no_stream}
    idempotency: {kind: operation_field, field: idempotency_key}
    event_bindings:
      - event: agentide.session.SessionStarted
        field: owner
        source: {kind: context, value: current_authority}
    projections: [session_snapshot_projection]
    obligations: [bind_session_stream, authorize_requested_session_scopes]

  - name: close_session
    scope: agentide.manage
    command: agentide.session.CloseSession
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: operation_field, field: expected_version}
    idempotency: {kind: operation_field, field: idempotency_key}
    guards:
      - name: may_close_session
        refusal_code: session_access_forbidden
        reads:
          - {kind: command_field, field: session_id}
          - {kind: context, value: current_authority}
          - {kind: context, value: executor_optional}
      - name: close_requires_active_session
        refusal_code: session_not_active
        reads:
          - {kind: command_field, field: session_id}
    projections: [session_snapshot_projection]
    obligations: [bind_session_stream, authorize_session_owner, require_active_session]

  - name: create_grant
    scope: agentide.manage
    command: agentide.coordination.CreateGrant
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: operation_field, field: expected_version}
    idempotency: {kind: operation_field, field: idempotency_key}
    event_bindings:
      - event: agentide.coordination.GrantCreated
        field: grant_id
        source: {kind: generated_uuid_v7}
    projections: [grant_snapshot_projection]
    obligations: [bind_session_stream, authorize_session_owner, require_active_session, validate_grantee_partition, inherit_grant_authority]

  - name: revoke_grant
    scope: agentide.manage
    command: agentide.coordination.RevokeGrant
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: operation_field, field: expected_version}
    idempotency: {kind: operation_field, field: idempotency_key}
    projections: [grant_snapshot_projection]
    obligations: [bind_session_stream, authorize_session_owner, require_active_session, nested_grant]

  - name: pin_context
    scope: agentide.manage
    command: agentide.coordination.PinContext
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: operation_field, field: expected_version}
    idempotency: {kind: operation_field, field: idempotency_key}
    event_bindings:
      - event: agentide.coordination.ContextPinned
        field: pin_id
        source: {kind: generated_uuid_v7}
    projections: [context_pin_snapshot_projection]
    obligations: [bind_session_stream, authorize_session_owner, require_active_session, inherit_context_pin_authority]

  - name: remove_context_pin
    scope: agentide.manage
    command: agentide.coordination.RemoveContextPin
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: operation_field, field: expected_version}
    idempotency: {kind: operation_field, field: idempotency_key}
    projections: [context_pin_snapshot_projection]
    obligations: [bind_session_stream, authorize_session_owner, require_active_session, nested_context_pin]

  - name: record_approval_checkpoint
    scope: agentide.manage
    command: agentide.coordination.RecordApprovalCheckpoint
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: operation_field, field: expected_version}
    idempotency: {kind: operation_field, field: idempotency_key}
    projections: [approval_checkpoint_snapshot_projection]
    obligations: [bind_session_stream, authorize_session_owner, require_active_session, inherit_checkpoint_authority]

  - name: approve_checkpoint
    scope: agentide.manage
    command: agentide.coordination.ApproveCheckpoint
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: operation_field, field: expected_version}
    idempotency: {kind: operation_field, field: idempotency_key}
    projections: [approval_checkpoint_snapshot_projection]
    obligations: [bind_session_stream, authorize_session_owner, require_active_session, nested_approval_checkpoint]

  - name: deny_checkpoint
    scope: agentide.manage
    command: agentide.coordination.DenyCheckpoint
    stream_id: {kind: command_field, field: session_id}
    expected_version: {kind: operation_field, field: expected_version}
    idempotency: {kind: operation_field, field: idempotency_key}
    projections: [approval_checkpoint_snapshot_projection]
    obligations: [bind_session_stream, authorize_session_owner, require_active_session, nested_approval_checkpoint]

queries:
  - name: get_session
    scope: agentide.read
    view: agentide.session.SessionSnapshot
    projection: session_snapshot_projection
    selectors:
      - {parameter: session_id, view_field: session_id}
    guards:
      - name: session_is_visible
        refusal_code: session_not_found
        reads:
          - {kind: view_field, field: owner}
          - {kind: view_field, field: scopes}
          - {kind: context, value: tenant_id}
          - {kind: context, value: realm_id_optional}
          - {kind: context, value: current_authority}
          - {kind: context, value: executor_optional}
    sort:
      - {view_field: session_id, direction: ascending}
    delivery: read_your_writes
    obligations: [partition_session_projection, filter_visible_sessions]

  - name: list_sessions
    scope: agentide.read
    view: agentide.session.SessionSnapshot
    projection: session_snapshot_projection
    selectors: []
    guards:
      - name: session_is_visible
        refusal_code: session_not_visible
        reads:
          - {kind: view_field, field: owner}
          - {kind: view_field, field: scopes}
          - {kind: context, value: tenant_id}
          - {kind: context, value: realm_id_optional}
          - {kind: context, value: current_authority}
          - {kind: context, value: executor_optional}
    sort:
      - {view_field: session_id, direction: ascending}
    delivery: read_your_writes
    obligations: [partition_session_projection, filter_visible_sessions]

  - name: list_grants
    scope: agentide.read
    view: agentide.coordination.GrantSnapshot
    projection: grant_snapshot_projection
    selectors:
      - {parameter: session_id, view_field: session_id}
    guards:
      - name: grants_are_visible
        refusal_code: session_not_visible
        reads:
          - {kind: view_field, field: owner}
          - {kind: view_field, field: scopes}
          - {kind: context, value: current_authority}
          - {kind: context, value: executor_optional}
    sort:
      - {view_field: grant_id, direction: ascending}
    delivery: read_your_writes
    obligations: [partition_session_projection, filter_visible_sessions, hide_closed_session_children]

  - name: list_context_pins
    scope: agentide.read
    view: agentide.coordination.ContextPinSnapshot
    projection: context_pin_snapshot_projection
    selectors:
      - {parameter: session_id, view_field: session_id}
    guards:
      - name: context_pins_are_visible
        refusal_code: session_not_visible
        reads:
          - {kind: view_field, field: owner}
          - {kind: view_field, field: scopes}
          - {kind: context, value: current_authority}
          - {kind: context, value: executor_optional}
    sort:
      - {view_field: pin_id, direction: ascending}
    delivery: read_your_writes
    obligations: [partition_session_projection, filter_visible_sessions, hide_closed_session_children]

  - name: list_approval_checkpoints
    scope: agentide.read
    view: agentide.coordination.ApprovalCheckpointSnapshot
    projection: approval_checkpoint_snapshot_projection
    selectors:
      - {parameter: session_id, view_field: session_id}
    guards:
      - name: checkpoints_are_visible
        refusal_code: session_not_visible
        reads:
          - {kind: view_field, field: owner}
          - {kind: view_field, field: scopes}
          - {kind: context, value: current_authority}
          - {kind: context, value: executor_optional}
    sort:
      - {view_field: checkpoint_id, direction: ascending}
    delivery: read_your_writes
    obligations: [partition_session_projection, filter_visible_sessions, hide_closed_session_children]
